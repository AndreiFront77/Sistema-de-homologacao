<section class="login-page">
	<div class="login-card">
		<p class="eyebrow">Sistema de Homologação</p>
		<h1>Entrar</h1>
		<p class="subtitle">Use seu e-mail e senha para acessar o painel.</p>

		<form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
			<label>
				<span>E-mail</span>
				<input type="email" formControlName="email" placeholder="voce@empresa.com" />
			</label>

			<p class="error" *ngIf="submitted && form.controls.email.invalid">
				Informe um e-mail válido.
			</p>

			<label>
				<span>Senha</span>
				<input type="password" formControlName="password" placeholder="••••••••" />
			</label>

			<p class="error" *ngIf="submitted && form.controls.password.invalid">
				Informe uma senha com no mínimo 4 caracteres.
			</p>

			<button type="submit">Entrar</button>
		</form>
	</div>
</section>
